name: Deploy to Server

# 触发：push 到 dev 自动部署测试环境 k-blog-test；
#       手动触发：在 main 上触发部署正式环境 k-blog，在 dev 上触发等效于自动部署。
# rollback_tag 留空时正常构建部署；填写历史标签（如 k-blog-test-42）时跳过构建直接回滚。
on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "可选：要回滚的 ACR 历史标签，如 k-blog-test-42；留空则正常构建部署"
        required: false
        default: ""
        type: string

# 同一分支同一时间只允许一个部署任务，避免并发互相覆盖
concurrency:
  group: deploy-kblog-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BUILD_NUMBER: ${{ github.run_number }}
      # 国内服务器才需要 Docker 镜像加速；secrets 为空则跳过此步骤
      # 注意：if 条件求值时拿不到 step 级 env，必须经 job 级 env 中转
      NEED_DOCKER_MIRROR: ${{ secrets.DOCKER_MIRROR_URL != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # 按分支区分部署上下文：
      #   dev          → 测试环境：镜像/容器 k-blog-test，宿主机端口 9001，前端 /var/www/k-Blog-test/dist
      #   其它（main） → 正式环境：镜像/容器 k-blog，端口 8087，前端 /var/www/k-Blog/dist
      # 两个环境同一台服务器并存，镜像/容器/端口/前端目录隔离；
      # 数据库共用 k_blog 库（application-prod.yml 默认连接），不单独分测试库
      - name: Set deployment context
        id: ctx
        run: |
          BRANCH="${GITHUB_REF_NAME:-}"
          if [[ "$BRANCH" == "dev" ]]; then
            echo "image_name=k-blog-test" >> "$GITHUB_OUTPUT"
            echo "container_name=k-blog-test" >> "$GITHUB_OUTPUT"
            echo "host_port=9001" >> "$GITHUB_OUTPUT"
            echo "cors_origin=https://test-blog.ksite.xin" >> "$GITHUB_OUTPUT"
            echo "web_dir=/var/www/k-Blog-test/dist" >> "$GITHUB_OUTPUT"
            echo "Deploy context: branch=dev → k-blog-test / k-blog-test / 9001 / 库共用 k_blog / CORS test-blog.ksite.xin / 前端 /var/www/k-Blog-test/dist"
          else
            echo "image_name=k-blog" >> "$GITHUB_OUTPUT"
            echo "container_name=k-blog" >> "$GITHUB_OUTPUT"
            echo "host_port=8087" >> "$GITHUB_OUTPUT"
            echo "cors_origin=" >> "$GITHUB_OUTPUT"
            echo "web_dir=/var/www/k-Blog/dist" >> "$GITHUB_OUTPUT"
            echo "Deploy context: branch=$BRANCH → k-blog / k-blog / 8087 / 库共用 k_blog / CORS 用 yml 默认 / 前端 /var/www/k-Blog/dist"
          fi

      # 国内 runner：配置 Docker 镜像加速（仅当配置了 DOCKER_MIRROR_URL）
      - name: Configure Docker registry mirror
        if: ${{ env.NEED_DOCKER_MIRROR == 'true' && (github.event_name != 'workflow_dispatch' || inputs.rollback_tag == '') }}
        env:
          DOCKER_MIRROR_URL: ${{ secrets.DOCKER_MIRROR_URL }}
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker
          sudo tee /etc/docker/daemon.json > /dev/null <<EOF
          {
            "registry-mirrors": ["$DOCKER_MIRROR_URL"],
            "max-concurrent-downloads": 10,
            "max-concurrent-uploads": 5
          }
          EOF
          sudo systemctl restart docker
          sleep 5
          docker info | grep -A 5 "Registry Mirrors" || true

      # 登录阿里云 ACR：Dockerfile 的基础镜像来自私有仓库 crpi-...aliyuncs.com/kk09，
      # 缺少凭据会拉取失败。设置过则登录；未设置则在构建时给出明确报错。
      - name: Login to Aliyun ACR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_tag == '' }}
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ACR_REGISTRY:?请在 GitHub Action secret 中设置 ACR_REGISTRY（如 crpi-g3stl1c9yrlh5x39.cn-beijing.personal.cr.aliyuncs.com）}"
          : "${ACR_USERNAME:?请在 GitHub Action secret 中设置 ACR_USERNAME}"
          : "${ACR_PASSWORD:?请在 GitHub Action secret 中设置 ACR_PASSWORD}"
          echo "${ACR_PASSWORD}" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin

      # 构建并推送到 ACR 仓库 kk09/kblog：
      #   环境滚动标签 {IMAGE_NAME}-latest + 构建号历史标签 {IMAGE_NAME}-{run_number}
      # （test 与 prod 共用一个 ACR 仓库，靠 tag 前缀隔离）
      - name: Build and push Docker image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_tag == '' }}
        env:
          IMAGE_NAME: ${{ steps.ctx.outputs.image_name }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          set -euo pipefail
          : "${ACR_REGISTRY:?请在 GitHub Action secret 中设置 ACR_REGISTRY}"

          ACR_IMAGE="${ACR_REGISTRY}/kk09/kblog"
          ACR_BUILD_TAG="${IMAGE_NAME}-${BUILD_NUMBER}"
          ACR_LATEST_TAG="${IMAGE_NAME}-latest"

          echo "Building ${ACR_IMAGE}:${ACR_BUILD_TAG}"
          docker build --progress=plain \
            -t "${ACR_IMAGE}:${ACR_BUILD_TAG}" \
            -t "${ACR_IMAGE}:${ACR_LATEST_TAG}" \
            --build-arg MAVEN_PROFILE=prod \
            --build-arg SKIP_TESTS=true \
            --build-arg BUILD_NUMBER="${BUILD_NUMBER}" \
            backend
          docker images "${ACR_IMAGE}"

          echo "Pushing immutable build tag ${ACR_BUILD_TAG}..."
          docker push "${ACR_IMAGE}:${ACR_BUILD_TAG}"
          echo "Pushing rolling tag ${ACR_LATEST_TAG}..."
          docker push "${ACR_IMAGE}:${ACR_LATEST_TAG}"
          echo "Docker image published to Aliyun ACR"

      - name: Deploy to server
        env:
          IMAGE_NAME: ${{ steps.ctx.outputs.image_name }}
          CONTAINER_NAME: ${{ steps.ctx.outputs.container_name }}
          HOST_PORT: ${{ steps.ctx.outputs.host_port }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag || '' }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          # SSH_USER / DEPLOY_PATH / ADMIN_USERNAME 等写死默认值，仍可用同名 secret 覆盖
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/root/k-blog' }}
          # 应用运行配置（全部来自 secrets，不在服务器维护配置文件）
          # 数据库凭据：用户名默认 kblog（未配 Secret 时）；密码必须配置 DB_PASSWORD
          DB_USERNAME: ${{ secrets.DB_USERNAME || 'kblog' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'kK' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DDL_AUTO: ${{ secrets.DDL_AUTO || 'update' }}
          # Redis（common-net 上外部已有，默认 redis:6379）
          REDIS_HOST: ${{ secrets.REDIS_HOST || 'redis' }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || '6379' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DATABASE: ${{ secrets.REDIS_DATABASE || '0' }}
          # 阿里云 OSS（默认关闭，与旧 deploy.sh 一致；启用时需配齐 AK/SK/endpoint/bucket）
          ALI_OSS_ENABLED: ${{ secrets.ALI_OSS_ENABLED || 'false' }}
          ALI_OSS_ENDPOINT: ${{ secrets.ALI_OSS_ENDPOINT }}
          ALI_OSS_BUCKET: ${{ secrets.ALI_OSS_BUCKET }}
          ALI_OSS_ACCESS_KEY_ID: ${{ secrets.ALI_OSS_ACCESS_KEY_ID }}
          ALI_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALI_OSS_ACCESS_KEY_SECRET }}
          ALI_OSS_PUBLIC_BASE_URL: ${{ secrets.ALI_OSS_PUBLIC_BASE_URL }}
          # AI 摘要（LLM，可选）
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          # CORS：dev 推送自动注入测试域名；正式环境为空，沿用 application-prod.yml 默认（blog.ksite.xin）
          CORS_ORIGIN: ${{ steps.ctx.outputs.cors_origin }}
          KEEP_VERSIONS: "5"
        run: |
          set -euo pipefail
          # 必填校验：缺一项立即报错，避免空值起库
          # 注：DB/ADMIN 等业务配置已在 Secrets 配置默认值，不做校验
          : "${SSH_HOST:?missing SSH_HOST secret}"
          : "${SSH_KEY:?missing SSH_KEY secret}"
          : "${ACR_REGISTRY:?missing ACR_REGISTRY secret}"
          : "${ACR_USERNAME:?missing ACR_USERNAME secret}"
          : "${ACR_PASSWORD:?missing ACR_PASSWORD secret}"

          SSH_PORT="${SSH_PORT:-22}"
          ACR_IMAGE="${ACR_REGISTRY}/kk09/kblog"
          if [[ -n "$ROLLBACK_TAG" ]]; then
            if [[ ! "$ROLLBACK_TAG" =~ ^${IMAGE_NAME}-[0-9]+$ ]]; then
              echo "Invalid rollback_tag: $ROLLBACK_TAG" >&2
              echo "Expected format: ${IMAGE_NAME}-<run_number>" >&2
              exit 1
            fi
            ACR_BUILD_TAG="$ROLLBACK_TAG"
            DEPLOY_BUILD_NUMBER="${ROLLBACK_TAG##*-}"
            echo "Rollback mode: deploying ${ACR_IMAGE}:${ACR_BUILD_TAG} with current GitHub Secrets"
          else
            ACR_BUILD_TAG="${IMAGE_NAME}-${BUILD_NUMBER}"
            DEPLOY_BUILD_NUMBER="$BUILD_NUMBER"
            echo "Normal deploy mode: deploying ${ACR_IMAGE}:${ACR_BUILD_TAG}"
          fi

          # 配置 SSH
          echo "=== [1/4] Configure SSH ==="
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Scanning SSH host key on port ${SSH_PORT}..."
          ssh-keyscan -p "$SSH_PORT" -t rsa,ecdsa,ed25519 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH configuration completed"

          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"

          # 确保部署目录存在
          echo "=== [2/4] Test SSH connection and prepare deploy directory ==="
          ssh -p "$SSH_PORT" $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "mkdir -p '$DEPLOY_PATH'"
          echo "SSH connection succeeded; deploy directory is ready"

          # 服务器登录 ACR；密码通过 SSH 标准输入传递，不出现在远程命令参数中
          echo "=== [3/4] Login server to Aliyun ACR ==="
          printf '%s\n' "$ACR_PASSWORD" | ssh -p "$SSH_PORT" $SSH_OPTS \
            "${SSH_USER}@${SSH_HOST}" \
            "docker login '$ACR_REGISTRY' -u '$ACR_USERNAME' --password-stdin"
          echo "Server logged in to Aliyun ACR"

          # 远程部署：拉取 ACR 镜像 → 停旧容器 → 起新容器 → 清理 → 重载 nginx
          # 容器名/端口按环境隔离（test=k-blog-test/9001，正式=k-blog/8087），
          # 网络共用 common-net，与旧 deploy.sh 保持一致
          echo "=== [4/4] Run remote deployment ==="
          ssh -p "$SSH_PORT" $SSH_OPTS \
            "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_PATH='$DEPLOY_PATH' IMAGE_NAME='$IMAGE_NAME' BUILD_NUMBER='$DEPLOY_BUILD_NUMBER' \
             ACR_REGISTRY='$ACR_REGISTRY' ACR_IMAGE='$ACR_IMAGE' ACR_BUILD_TAG='$ACR_BUILD_TAG' \
             CONTAINER_NAME='$CONTAINER_NAME' HOST_PORT='$HOST_PORT' \
             KEEP_VERSIONS='$KEEP_VERSIONS' \
             DB_USERNAME='$DB_USERNAME' DB_PASSWORD='$DB_PASSWORD' \
             ADMIN_USERNAME='$ADMIN_USERNAME' ADMIN_PASSWORD='$ADMIN_PASSWORD' \
             DDL_AUTO='$DDL_AUTO' \
             REDIS_HOST='$REDIS_HOST' REDIS_PORT='$REDIS_PORT' \
             REDIS_PASSWORD='$REDIS_PASSWORD' REDIS_DATABASE='$REDIS_DATABASE' \
             ALI_OSS_ENABLED='$ALI_OSS_ENABLED' ALI_OSS_ENDPOINT='$ALI_OSS_ENDPOINT' \
             ALI_OSS_BUCKET='$ALI_OSS_BUCKET' ALI_OSS_ACCESS_KEY_ID='$ALI_OSS_ACCESS_KEY_ID' \
             ALI_OSS_ACCESS_KEY_SECRET='$ALI_OSS_ACCESS_KEY_SECRET' \
             ALI_OSS_PUBLIC_BASE_URL='$ALI_OSS_PUBLIC_BASE_URL' \
             AI_API_KEY='$AI_API_KEY' \
             CORS_ORIGIN='$CORS_ORIGIN' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'docker logout "$ACR_REGISTRY" >/dev/null 2>&1 || true' EXIT
          echo "=== Starting deployment ==="
          cd "$DEPLOY_PATH"

          CONTAINER_PORT="8087"
          DOCKER_NETWORK="common-net"
          # 数据库连接走 application-prod.yml 默认（mysql:3306/k_blog，common-net 上外部已有），
          # 测试与正式共用同一 k_blog 库

          # 复用既有外部网络（MySQL/Redis 在其上），不重建数据库
          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 || docker network create "$DOCKER_NETWORK"

          echo "Pulling Docker image from Aliyun ACR..."
          docker pull "${ACR_IMAGE}:${ACR_BUILD_TAG}"
          docker tag "${ACR_IMAGE}:${ACR_BUILD_TAG}" "${IMAGE_NAME}:${BUILD_NUMBER}"
          docker tag "${ACR_IMAGE}:${ACR_BUILD_TAG}" "${IMAGE_NAME}:latest"
          docker rmi "${ACR_IMAGE}:${ACR_BUILD_TAG}" >/dev/null 2>&1 || true

          echo "Stopping old container..."
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          sleep 2

          # dev 推送时自动注入测试域名 CORS（覆盖 application-prod.yml 的 app.cors.allowed-origins）；
          # 正式环境为空 → 用 yml 默认 https://blog.ksite.xin
          EXTRA_ENV=()
          if [[ -n "$CORS_ORIGIN" ]]; then
            EXTRA_ENV+=( -e "APP_CORS_ALLOWED_ORIGINS=$CORS_ORIGIN" )
            echo "Injecting APP_CORS_ALLOWED_ORIGINS=$CORS_ORIGIN"
          else
            echo "CORS_ORIGIN empty → use application-prod.yml default"
          fi

          echo "Starting new container..."
          docker run -d --name "$CONTAINER_NAME" \
            -p "${HOST_PORT}:${CONTAINER_PORT}" \
            --restart always \
            --network "$DOCKER_NETWORK" \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e BUILD_NUMBER="$BUILD_NUMBER" \
            -e TZ=Asia/Shanghai \
            -e LOG_PATH=/app/logs \
            -e SPRING_DATASOURCE_USERNAME="$DB_USERNAME" \
            -e SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD" \
            -e DB_USERNAME="$DB_USERNAME" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e DDL_AUTO="$DDL_AUTO" \
            -e REDIS_HOST="$REDIS_HOST" \
            -e REDIS_PORT="$REDIS_PORT" \
            -e REDIS_PASSWORD="$REDIS_PASSWORD" \
            -e REDIS_DATABASE="$REDIS_DATABASE" \
            -e ALI_OSS_ENABLED="$ALI_OSS_ENABLED" \
            -e ALI_OSS_ENDPOINT="$ALI_OSS_ENDPOINT" \
            -e ALI_OSS_BUCKET="$ALI_OSS_BUCKET" \
            -e ALI_OSS_ACCESS_KEY_ID="$ALI_OSS_ACCESS_KEY_ID" \
            -e ALI_OSS_ACCESS_KEY_SECRET="$ALI_OSS_ACCESS_KEY_SECRET" \
            -e ALI_OSS_PUBLIC_BASE_URL="$ALI_OSS_PUBLIC_BASE_URL" \
            -e AI_API_KEY="$AI_API_KEY" \
            -e ADMIN_USERNAME="$ADMIN_USERNAME" \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            "${EXTRA_ENV[@]}" \
            "${IMAGE_NAME}:latest"

          sleep 3
          if ! docker ps --filter "name=^${CONTAINER_NAME}$" --filter "status=running" | grep -q "$CONTAINER_NAME"; then
            echo "=== Container failed to start! ==="
            docker logs "$CONTAINER_NAME" || true
            exit 1
          fi

          # 重载 Nginx（与旧 deploy.sh 一致）
          echo "=== Reload Nginx ==="
          if command -v nginx &>/dev/null; then
            nginx -t 2>/dev/null && nginx -s reload 2>/dev/null && echo "Nginx reloaded" || echo "WARN: nginx reload failed"
          elif systemctl is-active --quiet nginx 2>/dev/null; then
            systemctl reload nginx 2>/dev/null && echo "Nginx reloaded" || echo "WARN: nginx reload failed"
          else
            echo "WARN: nginx not detected, skip reload"
          fi

          # 清理：保留最近 N 个本地构建号镜像（latest 永不删）
          echo "=== Cleanup ==="
          KEEP="${KEEP_VERSIONS:-5}"
          docker image prune -f 2>/dev/null || true
          docker images "$IMAGE_NAME" --format '{{.Tag}} {{.ID}}' \
            | grep -v '<none>' \
            | grep -v '^latest ' \
            | sort -t' ' -k1 -n -r \
            | tail -n +"$((KEEP + 1))" \
            | awk '{print $2}' \
            | while read -r id; do
                echo "Removing old image: $id"
                docker rmi "$id" 2>/dev/null || true
              done

          echo "=== Container status ==="
          docker ps --filter "name=$CONTAINER_NAME" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo "=== App logs (last 20 lines) ==="
          docker logs --tail 20 "$CONTAINER_NAME" || true
          echo "=== Deployment completed ==="
          REMOTE
          echo "Remote deployment command completed"

      # 前端构建：Vite 产物与运行环境无关（API 走相对路径 /api，由服务器 nginx 代理），
      # dev 与 main 共用同一构建流程；回滚（rollback_tag 非空）时不动前端
      - name: Setup Node.js
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_tag == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_tag == '' }}
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          echo "=== dist 内容 ==="
          ls -la dist/

      # 前端发布：tar 打包经 SSH 流式解压到服务器静态站点根目录（复用 Deploy 步骤写入的 deploy_key）
      # dev → /var/www/k-Blog-test/dist；main → /var/www/k-Blog/dist（与服务器 nginx root 一致）
      - name: Deploy frontend
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.rollback_tag == '' }}
        env:
          WEB_DIR: ${{ steps.ctx.outputs.web_dir }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          echo "Publishing frontend dist → ${SSH_USER}@${SSH_HOST}:${WEB_DIR}"
          tar -C frontend/dist -cf - . | ssh -p "$SSH_PORT" $SSH_OPTS \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '$WEB_DIR' && tar -C '$WEB_DIR' -xf - && echo '=== 已发布文件（前 10 个）===' && ls '$WEB_DIR' | head -10"

      - name: Logout from Aliyun ACR
        if: always()
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          if [[ -n "$ACR_REGISTRY" ]]; then
            docker logout "$ACR_REGISTRY" || true
          fi
