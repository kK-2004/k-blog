spring:
  datasource:
    url: jdbc:mysql://localhost:3306/k_blog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: kblog
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: info
#    org.hibernate.orm.jdbc.bind: trace

