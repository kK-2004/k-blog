spring:
  datasource:
    url: jdbc:mysql://localhost:3306/kblog?useSSL=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

logging:
  file:
    path: /logs
  level:
    org.hibernate.SQL: warn

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    defaults:
      enabled: true

app:
  admin:
    username: ${ADMIN_USERNAME:kK}
    password: ${ADMIN_PASSWORD}
  ip:
    fastapi:
      enabled: true
      connect-timeout-ms: ${IP_FASTAPI_CONNECT_TIMEOUT_MS:800}
      read-timeout-ms: ${IP_FASTAPI_READ_TIMEOUT_MS:1200}
