spring:
  datasource:
    url: jdbc:mysql://localhost:3306/kblog?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

logging:
  file:
    path: /logs
  level:
    org.hibernate.SQL: warn

app:
  admin:
    username: ${ADMIN_USERNAME:Admin}
    password: ${ADMIN_PASSWORD}
  ip:
    fastapi:
      enabled: true
      url-template: ${IP_FASTAPI_URL_TEMPLATE}
      connect-timeout-ms: ${IP_FASTAPI_CONNECT_TIMEOUT_MS:800}
      read-timeout-ms: ${IP_FASTAPI_READ_TIMEOUT_MS:1200}
